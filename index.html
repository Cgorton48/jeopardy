    <script>
// Global game state
var currentGameData = null;
var currentRound = 'single'; // 'single' or 'double'
var gameProgress = null;

// Load or initialize game data
function loadGameData() {
    const currentGameId = gameManager.getCurrentGameId();
    
    if (currentGameId) {
        currentGameData = gameManager.loadGame(currentGameId);
    }
    
    // If no game loaded, use default game
    if (!currentGameData) {
        // Try to load default game from JSON file
        fetch('games/default-game.json')
            .then(response => response.json())
            .then(data => {
                currentGameData = data;
                const gameId = gameManager.saveGame(currentGameData);
                gameManager.setCurrentGameId(gameId);
                checkForSavedProgress();
            })
            .catch(err => {
                console.error('Error loading default game:', err);
                // Fallback to empty game
                currentGameData = gameManager.createEmptyGame();
                const gameId = gameManager.saveGame(currentGameData);
                gameManager.setCurrentGameId(gameId);
                checkForSavedProgress();
            });
        return;
    }
    
    checkForSavedProgress();
}

// Check for saved progress and prompt user
function checkForSavedProgress() {
    const savedProgress = gameManager.loadProgress(currentGameData.id);
    
    if (savedProgress && savedProgress.answeredQuestions && savedProgress.answeredQuestions.length > 0) {
        // Add Resume/New Game options to the start screen
        $('#options .modal').prepend(`
            <div class="progress-notification">
                <h3>Saved Progress Found!</h3>
                <p>Would you like to resume your previous game?</p>
                <button class="submit" id="resumeGame">Resume Game</button>
                <button class="submit" id="newGame">Start New Game</button>
            </div>
        `);
        
        $('#resumeGame').click(function() {
            loadProgress(savedProgress);
            $(this).parent().remove();
            game.init();
        });
        
        $('#newGame').click(function() {
            gameManager.clearProgress(currentGameData.id);
            $(this).parent().remove();
            renderGameBoard();
        });
    } else {
        renderGameBoard();
    }
}

// Load progress into game
function loadProgress(progress) {
    gameProgress = progress;
    currentRound = progress.round || 'single';
    
    renderGameBoard();
    
    // Restore team names and scores
    if (progress.teams && progress.teams.length > 0) {
        // Set the team selector to the correct number of teams
        $('#teamSelect').val(progress.teams.length);
        
        // Show the correct number of teams
        $('#teams .team').hide();
        progress.teams.forEach((team, idx) => {
            const teamEl = $('#teams .team').eq(idx);
            teamEl.show();
            teamEl.find('.name').text(team.name);
            teamEl.find('.points').text(team.score);
        });
    }
    
    // Mark answered questions
    if (progress.answeredQuestions) {
        progress.answeredQuestions.forEach(qId => {
            const parts = qId.split('-');
            if (parts[0] === currentRound) {
                const row = parseInt(parts[1]);
                const col = parseInt(parts[2]);
                const cell = $('#question-grid .table-row').eq(row).find('.table-cell').eq(col);
                cell.find('h3').css('opacity', 0);
            }
        });
    }
    
    // Handle double jeopardy state
    if (currentRound === 'double') {
        $('body').addClass('doublejeopardy');
        $('#double-jeopardy').css('display', 'none');
    }
}

// Save current progress
function saveProgress() {
    if (!currentGameData || !currentGameData.id) return;
    
    const teams = [];
    $('#teams .team:visible').each(function() {
        teams.push({
            name: $(this).find('.name').text(),
            score: parseInt($(this).find('.points').text()) || 0
        });
    });
    
    const answeredQuestions = [];
    $('#question-grid .table-row').each(function(rowIdx) {
        $(this).find('.table-cell').each(function(colIdx) {
            if ($(this).find('h3').css('opacity') === '0') {
                answeredQuestions.push(`${currentRound}-${rowIdx}-${colIdx}`);
            }
        });
    });
    
    const progress = {
        round: currentRound,
        teams: teams,
        answeredQuestions: answeredQuestions
    };
    
    gameManager.saveProgress(currentGameData.id, progress);
}

// Auto-save with debounce
let saveTimeout;
function autoSave() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveProgress, 1000);
}

// Render game board from current game data
function renderGameBoard() {
    if (!currentGameData) return;
    
    const round = currentRound === 'single' ? 'single' : 'double';
    
    // Render categories
    const categoriesHtml = currentGameData.categories.map((cat, idx) => `
        <div class="table-cell">
            <div class="table-cell-inner"><h2 data-title="${cat.double}">${cat[round]}</h2></div>
        </div>
    `).join('');
    
    $('#categories').html(categoriesHtml);
    
    // Render questions
    const questionsHtml = currentGameData.questions[round].map((row, rowIdx) => {
        const cells = row.map((q, colIdx) => `
            <div data-points="${q.points}" data-dailydouble="" class="table-cell ${!q.answer && !q.question ? 'empty' : ''}">
                <div class="table-cell-inner">
                    <h3>${q.points}</h3>
                    <div class="answer" data-answer="${escapeHtml(q.answer)}">${escapeHtml(q.answer)}</div>
                    <div class="question" data-question="${escapeHtml(q.question)}">${escapeHtml(q.question)}</div>
                </div>
            </div>
        `).join('');
        
        return `<div class="table-row">${cells}</div>`;
    }).join('');
    
    $('#question-grid').html(questionsHtml);
    
    // Re-bind click events
    bindQuestionEvents();
    
    $(window).resize();
}

// Escape HTML to prevent XSS
function escapeHtml(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return String(text).replace(/[&<>"']/g, m => map[m]);
}

// Bind events to question cells
function bindQuestionEvents() {
    $('#question-grid .table-cell:not(.empty) .table-cell-inner').off('mouseenter mouseleave click');
    
    $('#question-grid .table-cell:not(.empty) .table-cell-inner').mouseenter(function() {
        $(this).find('h3').addClass('animated rubberBand');
        $('#click')[0].play();
    }).mouseleave(function() {
        $(this).find('h3').removeClass('animated rubberBand');
        $('#click')[0].currentTime = 0;
    });
    
    $('#question-grid .table-cell:not(.empty)').on("click", function(){
        modal.show(this);
    });
}

// Populate game selector
function populateGameSelector() {
    const games = gameManager.getGamesList();
    const currentGameId = gameManager.getCurrentGameId();
    const select = $('#gameSelect');
    
    select.empty();
    
    if (games.length === 0) {
        select.append('<option value="">No games available - Visit Admin</option>');
        return;
    }
    
    games.forEach(game => {
        const option = $(`<option value="${game.id}">${game.name}</option>`);
        if (game.id === currentGameId) {
            option.attr('selected', 'selected');
        }
        select.append(option);
    });
}

// Handle game selection change
function handleGameChange() {
    const selectedGameId = $('#gameSelect').val();
    if (selectedGameId && selectedGameId !== gameManager.getCurrentGameId()) {
        if (confirm('Switching games will reload the page. Continue?')) {
            gameManager.setCurrentGameId(selectedGameId);
            location.reload();
        } else {
            // Reset to current game
            $('#gameSelect').val(gameManager.getCurrentGameId());
        }
    }
}

modal.reveal = function(){
    var q = $('#question-modal').find(".question")
    q.css({
        "display": "block",
    });
    function scrollTo(element, to, duration) {
        var start = element.scrollTop,
        change = to - start,
        currentTime = 0,
        increment = 20;

        var animateScroll = function(){        
            currentTime += increment;
            var val = easeInOutQuad(currentTime, start, change, duration);
            element.scrollTop = val;
            if(currentTime < duration) {
                setTimeout(animateScroll, increment);
            }
        };
        animateScroll();
    }

    //t = current time
    //b = start value
    //c = change in value
    //d = duration
    function easeInOutQuad(t, b, c, d){
        t /= d/2;
        if (t < 1) return c/2*t*t + b;
        t--;
        return -c/2 * (t*(t-2) - 1) + b;
    };

    var original_val = $('#question-modal .modal-inner').scrollTop()
    $('#question-modal .modal-inner').scrollTop(0)
    var val = $('#question-modal .question').offset().top - $('#question-modal .modal-inner').offset().top
    $('#question-modal .modal-inner').scrollTop(original_val)
    scrollTo($('#question-modal .modal-inner').get(0), val, 250)

    setTimeout(function(){
        q.addClass("reveal");
    }, 0)

    $('.active-question h3').css({
        "opacity": 0
    })
}

            $('#eight')[0].play();
        } else if(e.keyCode == NINE) {
            $('#nine')[0].play();
        } else if(e.keyCode == ZERO) {
            $('#zero')[0].play();
        }
    });

    $('.expanded').removeClass("expanded");

    setTimeout(function(){
        if (dailydouble === 'daily-double') {
            $('#question-modal').addClass('dailydouble');
            $('.answer').prepend('<h2 class="dailydouble animated lightSpeedIn">DAILY DOUBLE</h2>');
        } else {
            $('#question-modal').removeClass('dailydouble');
            $('.dailydouble').remove();
        }

        $('#question-modal').addClass("expanded");

        $('#question-modal').css({
            top:0,
            left:0,
            bottom:0,
            right:0,
            width: '100%',
            height: '100%',
            borderWidth:0,
            transform: "translate(0px, 0px) scale(1)"
        });
    }, 1);
}

modal.hide = function(){
    $(window).off("keydown.question-modal");
    $('#question-modal').hide();
    $('#question-modal').removeClass("expanded");
    $('#question-modal').css({
        borderWidth:3
    });
    $('#question-modal .modal-inner').html("");
}

$(document).ready(function(){

    $('#question-modal').on("click", '#answer-button', function(){
        modal.reveal();
    })

    $('#question-modal').on("click", '#continue-button', function(){
        modal.hide();
    });
    
    // Reset progress button
    $('#resetProgress').on('click', function() {
        if (confirm('Are you sure you want to reset all game progress? This will clear all scores and answered questions.')) {
            if (currentGameData && currentGameData.id) {
                gameManager.clearProgress(currentGameData.id);
            }
            location.reload();
        }
    });
    
    // Auto-save when team names change
    $('body').on('blur', '.team .name', function() {
        autoSave();
    });

// prevent the buttons from being highlighted
$('body').on("mousedown", ".minus, .plus", function(e){
    e.preventDefault();
});

$('body').on("click", ".plus", function(e){
    var $points = $(this).closest(".team").find(".points")
    var points = parseInt($points.text())
    var val = parseInt($(".active-question").attr("data-points") || 100);
    var dailydouble = $(".active-question").attr("data-dailydouble");

    // console.log(dailydouble);

    if (dailydouble === 'daily-double') {
        points += val * 2;
    } else {
        points += val;
    }

    $points.text(points);

    $('.active-question h3').css({
        "opacity": 0
    });

    $('#right')[0].play();
    autoSave();
});

$('body').on("click", ".minus", function(e){
    var $points = $(this).closest(".team").find(".points")
    var points = parseInt($points.text())
    var val = parseInt($(".active-question").attr("data-points") || 100);
    var dailydouble = $(".active-question").attr("data-dailydouble");

    if (dailydouble === 'daily-double') {
        points -= val * 2;
    } else {
        points -= val;
    }

    $points.text(points);

    $('.active-question h3').css({
        "opacity": 0
    });

    $('#wrong')[0].play();
    autoSave();
});

$(window).resize();

});
</script>
